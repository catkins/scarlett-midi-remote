# Reasonable Swift 6 / SwiftUI defaults. Prefer correctness over style nits so
# existing sources stay green without a repo-wide reformat.
included:
  - App
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - ScarlettMidiControl.xcodeproj

disabled_rules:
  - todo
  - trailing_whitespace
  - trailing_newline
  - identifier_name
  - type_name
  - nesting
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - multiple_closures_with_trailing_closure
  - closure_body_length
  - unused_closure_parameter
  - trailing_comma
  - opening_brace
  - implicitly_unwrapped_optional
  - for_where
  - optional_data_string_conversion
  - inclusive_language

opt_in_rules:
  - empty_count
  - first_where
  - last_where
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 200
  error: 400
  ignores_urls: true
  ignores_comments: true

reporter: "xcode"
