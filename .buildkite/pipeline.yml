agents:
  queue: hosted-macos

cache:
  paths:
    - ".build"
  key: "swift-build-v1-$BUILDKITE_COMMIT"

steps:
  - label: ":swift: Lint"
    key: lint
    command: ./scripts/ci.sh lint
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2

  - label: ":swift: Test"
    key: test
    command: ./scripts/ci.sh test
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2
