agents:
  queue: hosted-macos

cache:
  paths:
    - ".build"
  key: "swift-build-v1-$BUILDKITE_COMMIT"

steps:
  - label: ":swift: Lint"
    key: lint
    command: ./scripts/ci.sh lint
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2

  - label: ":swift: Test"
    key: test
    command: bktec run
    plugins:
      - tests#v1.0.0:
          test-runner: custom
          test-cmd: ./scripts/ci.sh test
          test-file-pattern: Tests/**/*Tests.swift
          result-path: tmp/swift-test-results.xml
          suite-slug: scarlett-midi-remote
          upload-results: true
          fail-on-no-tests: true
          tags:
            - language=swift
            - os=macos
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2

  - label: ":package: App"
    key: build
    command: ./scripts/ci.sh build
    artifact_paths:
      - "tmp/ScarlettMidiControl.app.zip"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2
